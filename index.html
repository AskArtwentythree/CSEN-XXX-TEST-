<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Taskflow — plan projects and track tasks." />
    <title>Taskflow</title>
    <script>
      // Apply the saved theme before first paint to avoid a light-to-dark flash.
      (function () {
        var theme = 'system';
        try {
          theme = JSON.parse(localStorage.getItem('taskflow:state:v1')).theme || 'system';
        } catch (e) {}
        if (theme === 'system') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
